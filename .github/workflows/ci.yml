name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://tplace:tplace@localhost:5432/tplace
  TEST_REDIS_URL: redis://localhost:6379
  TEST_S3_ENDPOINT: http://127.0.0.1:9000

# Every command runs through scripts/ci-run.sh, which republishes the tail of a
# failing command's output as check-run annotations (readable via the REST API).

jobs:
  checks:
    name: Typecheck, lint, contract, tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tplace
          POSTGRES_PASSWORD: tplace
          POSTGRES_DB: tplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tplace -d tplace"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: scripts/ci-run.sh "pnpm install" pnpm install --frozen-lockfile
      - run: scripts/ci-run.sh "typecheck" pnpm typecheck
      - run: scripts/ci-run.sh "lint" pnpm lint
      - run: scripts/ci-run.sh "contract lint" pnpm api:lint

      # MinIO stands in for R2, exactly as in docker-compose. It runs as a
      # container step rather than a service because service containers cannot
      # be given a command, and the minio image needs `server /data`.
      - name: Start MinIO
        run: scripts/ci-run.sh "start minio" scripts/ci-minio.sh

      - name: Apply migrations
        run: scripts/ci-run.sh "migrate" pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests (unit + integration)
        run: scripts/ci-run.sh "vitest" pnpm test

      - name: Janitor runs end to end against the stack
        run: scripts/ci-run.sh "janitor" pnpm cli janitor:run
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          R2_ENDPOINT: ${{ env.TEST_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: tplace
          R2_SECRET_ACCESS_KEY: tplace-secret
          R2_BUCKET_MEDIA: tplace-media-dev

      - run: scripts/ci-run.sh "build" pnpm build

      - name: End-to-end over HTTP (built API + worker processes)
        run: scripts/ci-run.sh "e2e" pnpm e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          R2_ENDPOINT: ${{ env.TEST_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: tplace
          R2_SECRET_ACCESS_KEY: tplace-secret
          R2_BUCKET_MEDIA: tplace-media-dev

  worker:
    name: Edge Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: edge-worker/pnpm-lock.yaml
      - run: ../scripts/ci-run.sh "worker install" pnpm install --frozen-lockfile
        working-directory: edge-worker
      - run: ../scripts/ci-run.sh "worker typecheck" pnpm typecheck
        working-directory: edge-worker
      - run: ../scripts/ci-run.sh "worker tests" pnpm test
        working-directory: edge-worker
      - name: Bundle (dry run, no deploy)
        run: ../scripts/ci-run.sh "worker bundle" npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
        working-directory: edge-worker
      - name: Smoke test in the real workerd runtime (wrangler dev, local R2)
        run: ../scripts/ci-run.sh "worker smoke" test/smoke.sh
        working-directory: edge-worker

  apple:
    name: visionOS app (Xcode)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
      - name: API package diagnostics (plain compiler output, full compile)
        run: >-
          ../../../scripts/ci-run.sh "swiftc emit-library" bash -c
          'xcrun swiftc -emit-library -emit-module -module-name ThirdPlaceAPI -swift-version 5 -parse-as-library
          -emit-module-path /tmp/ThirdPlaceAPI.swiftmodule -o /tmp/libThirdPlaceAPI.dylib Sources/ThirdPlaceAPI/*.swift'
        working-directory: visionos-app/Packages/ThirdPlaceAPI
      - name: API package via xcodebuild (diagnostic only)
        continue-on-error: true
        run: >-
          ../../../scripts/ci-run.sh "xcodebuild package" ../../../scripts/ci-filter.sh
          "error:|warning:|BUILD|xcodebuild: "
          xcodebuild build -scheme ThirdPlaceAPI -destination "platform=macOS" -derivedDataPath /tmp/dd-package
        working-directory: visionos-app/Packages/ThirdPlaceAPI
      - name: API package library builds (macOS)
        run: >-
          ../../../scripts/ci-run.sh "swift build (library)" ../../../scripts/ci-filter.sh
          "error|warning|fatal|Stack dump|Compiling|Build|Linking"
          swift build --disable-index-store
        working-directory: visionos-app/Packages/ThirdPlaceAPI
      - name: API package tests build (macOS)
        run: >-
          ../../../scripts/ci-run.sh "swift build (tests)" ../../../scripts/ci-filter.sh
          "error|warning|fatal|Stack dump|Compiling|Build|Linking"
          swift build --build-tests --disable-index-store
        working-directory: visionos-app/Packages/ThirdPlaceAPI
      - name: API package tests (macOS)
        run: ../../../scripts/ci-run.sh "swift test" swift test --skip-build --disable-index-store
        working-directory: visionos-app/Packages/ThirdPlaceAPI
      - name: Install XcodeGen
        run: ../scripts/ci-run.sh "xcodegen install" brew install xcodegen
        working-directory: visionos-app
      - name: Generate the Xcode project
        run: ../scripts/ci-run.sh "xcodegen generate" xcodegen generate
        working-directory: visionos-app
      - name: visionOS simulator runtime
        run: |
          xcodebuild -showsdks | grep -i xros || true
          xcrun simctl list runtimes | grep -i visionos || sudo xcodebuild -downloadPlatform visionOS
      - name: Boot an Apple Vision Pro simulator
        run: ../scripts/ci-run.sh "simulator" ../scripts/ci-visionos-sim.sh
        working-directory: visionos-app
      - name: Build the app for the visionOS simulator
        working-directory: visionos-app
        run: >-
          ../scripts/ci-run.sh "xcodebuild" ../scripts/ci-filter.sh
          "error:|warning: .*(deprecated|unused)|BUILD|Compiling|Linking|note: Using|xcodebuild: "
          xcodebuild build -project ThirdPlace.xcodeproj -scheme ThirdPlace -configuration Debug
          -destination "generic/platform=visionOS Simulator"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation
      - name: Build the MV-HEVC bundle generator
        working-directory: tools/mvhevc
        run: ../../scripts/ci-run.sh "make-bundle build" swift build -c release
      - name: Render two short MV-HEVC stereo bundles (real VideoToolbox encode)
        working-directory: tools/mvhevc
        run: |
          ../../scripts/ci-run.sh "make-bundle main" .build/release/make-bundle --out /tmp/bundles/main --label MAIN --hue 0.60 --seconds 6 --width 1280 --height 720 --mov /tmp/bundles/main.mov
          ../../scripts/ci-run.sh "make-bundle side" .build/release/make-bundle --out /tmp/bundles/side --label SIDE --hue 0.08 --seconds 6 --width 1280 --height 720
          (cd /tmp/bundles/main && zip -qr ../main.zip .)
          (cd /tmp/bundles/side && zip -qr ../side.zip .)
          ls -la /tmp/bundles /tmp/bundles/main /tmp/bundles/main/hd
          echo "::notice title=mvhevc bundle::$(cat /tmp/bundles/main/index.m3u8 | tr '\n' ' ')"
          echo "::notice title=mvhevc media playlist::$(head -12 /tmp/bundles/main/hd/playlist.m3u8 | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: mvhevc-bundles
          path: |
            /tmp/bundles/main.zip
            /tmp/bundles/side.zip
            /tmp/bundles/main.mov
          retention-days: 7
      - name: Run the app's unit tests on the simulator
        working-directory: visionos-app
        run: >-
          ../scripts/ci-run.sh "xcodebuild test" ../scripts/ci-filter.sh
          "error:|Test Case|Test Suite|Executed|BUILD|TEST|xcodebuild: "
          xcodebuild test -project ThirdPlace.xcodeproj -scheme ThirdPlace -configuration Debug
          -destination "platform=visionOS Simulator,id=$(cat .sim-udid)"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation

  media:
    name: Real MV-HEVC bundle through the pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [apple, checks]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tplace
          POSTGRES_PASSWORD: tplace
          POSTGRES_DB: tplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tplace -d tplace"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/ci-run.sh "pnpm install" pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mvhevc-bundles
          path: /tmp/bundles
      - run: ls -la /tmp/bundles
      - name: Start MinIO
        run: scripts/ci-run.sh "start minio" scripts/ci-minio.sh
      - run: scripts/ci-run.sh "migrate" pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: scripts/ci-run.sh "build" pnpm build
      - name: End-to-end with the generated MV-HEVC bundles
        run: scripts/ci-run.sh "media e2e" pnpm e2e
        env:
          E2E_BUNDLE_DIR: /tmp/bundles
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          R2_ENDPOINT: ${{ env.TEST_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: tplace
          R2_SECRET_ACCESS_KEY: tplace-secret
          R2_BUCKET_MEDIA: tplace-media-dev

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: third-place-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes the image to GitHub Container Registry on main — only when the
  # repository variable PUBLISH_IMAGE is "true" (deploy/README.md). Until it is
  # set this job is skipped and nothing leaves CI.
  publish:
    name: Publish image (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [checks, worker]
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGE == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
