# Example: run the console next to the backend's compose stack. The console
# is static; everything environment-specific arrives through these two
# variables at start-up.
services:
  console:
    image: ghcr.io/vijaykhanna99/third-place-console:latest
    build: ..
    restart: unless-stopped
    environment:
      API_BASE_URL: https://api.example.com
      APP_KEY: ${APP_KEY:?set APP_KEY to one of the backend APP_KEYS}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
