# Production / staging stack for one host. Postgres and Redis are expected to be
# managed services (DATABASE_URL / REDIS_URL in .env.production); R2 and the
# edge Worker live at Cloudflare. See deploy/README.md.
#
#   cp deploy/env.production.example deploy/.env.production   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Order: migrate (one-shot) → api + worker → caddy.

name: third-place

x-app: &app
  image: ${IMAGE:-third-place-backend:local}
  env_file: .env.production
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  migrate:
    <<: *app
    command: ["node", "dist/db/migrate.js"]
    restart: "no"

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # Caddy is the only hop in front of the API on this host.
      TRUSTED_PROXIES: "1"
    expose: ["3000"]
    healthcheck:
      # Readiness, not liveness: only a ready instance should receive traffic.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 768M }

  worker:
    <<: *app
    command: ["node", "dist/jobs/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SCRATCH_DIR: /scratch
    volumes:
      # Archives are downloaded here before extraction: size it for two
      # concurrent 5 GiB archives plus headroom (worker concurrency is 2).
      - scratch:/scratch
    # Must exceed WORKER_SHUTDOWN_TIMEOUT_MS (default 25 s) so an in-flight
    # extraction is closed by the worker, not killed by Docker.
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { memory: 2G }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  scratch:
  caddy_data:
  caddy_config:
